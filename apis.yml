name: Tailorbird
description: >-
  Tailorbird is a CapEx orchestration platform for the multifamily real estate
  industry, replacing spreadsheet-based capital planning with AI-generated
  property intelligence. The platform produces unit-level as-builts, takeoffs,
  and interior models, runs renovation ROI and five-year capital plans, and
  tracks spend and budget variance in real time across apartment portfolios.
  Tailorbird ingests PCAs and property documents, integrates with major
  property-management ERPs including Yardi, RealPage, Entrata, and MRI via
  custom APIs and ELTs, and maintains SOC 2 Type II compliance. Founded in 2020
  and based in Princeton, New Jersey, it serves 28 of the NMHC Top 50 operators
  and manages more than $2B in annual CapEx across over one million mapped
  units. It is a Bloomberg Beta portfolio company.
